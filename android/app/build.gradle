
plugins {
    id 'com.android.application'
}

def hasReleaseSigning =
    System.getenv("ANDROID_KEYSTORE_FILE") &&
    System.getenv("ANDROID_KEYSTORE_PASSWORD") &&
    System.getenv("ANDROID_KEY_ALIAS") &&
    System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.shahabmillizai.candyblast'
    compileSdk 36

    defaultConfig {
        applicationId "com.shahabmillizai.candyblast"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            startIoAppId: "210945361"
        ]
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
                def keystoreFile = file(keystorePath)
                if (!keystoreFile.exists() && file("../" + keystorePath).exists()) {
                    keystoreFile = file("../" + keystorePath)
                }
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'

    // Official Start.io SDK
    implementation 'com.startapp:inapp-sdk:5.4.0'
}
