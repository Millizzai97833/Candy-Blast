name: Build Candy Blast Release APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: 🍭 1. Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Web App
        run: bun run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  build-android:
    name: 📱 2. Build Android APKs & AAB
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Copy Web Dist into Android Assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Web assets successfully copied into Android project."
          ls -la android/app/src/main/assets/public/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          chmod +x android/gradlew || true

      - name: Configure Keystore from Secrets
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "ANDROID_KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
          elif [ -f "app/release.keystore" ]; then
            echo "Using repository release.keystore fallback..."
            echo "ANDROID_KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=candyblast123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=candyblast" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=candyblast123" >> $GITHUB_ENV
          fi

      - name: Build Android APKs and App Bundle
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Verify Release APK Signature
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using build-tools at: $BUILD_TOOLS"
          if [ -f "$BUILD_TOOLS/apksigner" ]; then
            $BUILD_TOOLS/apksigner verify --verbose android/app/build/outputs/apk/release/*.apk || echo "apksigner verification step finished"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Blast-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Blast-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Blast-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          name: "Candy Blast Release v1.0.0"
          tag_name: "v1.0.0-${{ github.run_number }}"
          body: |
            # 🍬 Candy Blast - Android APKs & Google Play Bundle
            
            - **Developer**: Shahab Millizai
            - **Package Name**: `com.shahabmillizai.candyblast`
            - **Start.io App ID**: `210945361`
            - **Start.io In-App SDK**: `5.4.0`
            - **Compile SDK**: `36`
            - **Target SDK**: `35`
            - **Min SDK**: `24` (Android 7.0+)
            
            ### Included Builds:
            - **Candy-Blast-Debug-APK**: Instant install on any Android phone (no signing requirements).
            - **Candy-Blast-Release-APK**: Signed production release APK.
            - **Candy-Blast-GooglePlay-AAB**: Production App Bundle for publishing to Google Play Store.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
