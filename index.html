<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Candy Blast - Sweet Match 3 Saga</title>
    <meta name="description" content="Play Candy Blast! The sweetest match-3 puzzle game with juicy cascades, special candies, and exciting levels." />
    <meta property="og:title" content="Candy Blast - Sweet Match 3 Saga" />
    <meta property="og:description" content="Play Candy Blast! The sweetest match-3 puzzle game with juicy cascades, special candies, and exciting levels." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    </noscript>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #2b083c;
        color: #ffffff;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body class="bg-[#2b083c] text-white">
    <div id="root">
      <div style="position:fixed;inset:0;background:#2b083c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;z-index:99999;">
        <div style="font-size:42px;margin-bottom:12px;animation:candyPulse 1.2s infinite ease-in-out;">🍬</div>
        <div style="font-size:26px;font-weight:900;letter-spacing:1.5px;color:#f472b6;text-shadow:0 3px 6px rgba(0,0,0,0.5);">CANDY BLAST</div>
        <div style="margin-top:16px;width:130px;height:6px;background:rgba(255,255,255,0.15);border-radius:9999px;overflow:hidden;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,#ec4899,#fbbf24,#22c55e);animation:candyLoad 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes candyPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
          @keyframes candyLoad { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
